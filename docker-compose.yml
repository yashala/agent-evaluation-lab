services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentlab}
      POSTGRES_DB: agentlab
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlab -d agentlab"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
