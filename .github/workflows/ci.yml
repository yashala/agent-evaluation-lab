name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: agentlab
          POSTGRES_PASSWORD: agentlab
          POSTGRES_DB: agentlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentlab" --health-interval 2s --health-retries 30
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --project api --frozen
      - run: uv run --project api ruff check api evals
      - run: uv run --project api ruff format --check api evals
      - run: uv run --project api mypy --config-file api/pyproject.toml api/src api/tests evals/run.py evals/gate.py evals/report.py evals/rescore.py evals/langsmith_experiment.py evals/audit_current.py
      - name: Verify committed comparison evidence
        run: uv run --project api python evals/audit_current.py --check
      - run: uv run pytest
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://agentlab:agentlab@localhost:5432/agentlab_test
      - name: Deterministic evaluation gate (no API keys)
        run: |
          uv run --project api python evals/run.py --model rule-baseline --out /tmp/gate
          uv run --project api python evals/gate.py /tmp/gate/*

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv export --project api --frozen --no-hashes --no-dev --no-emit-project > requirements.txt
      - run: uvx pip-audit -r requirements.txt
      - run: npm audit --omit=dev
        working-directory: web
