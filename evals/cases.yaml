# Evaluation cases. Facts use "|" for acceptable alternatives (any one must appear).
# Sessions: C-1001 Maya (US), C-1002 Jonas (EU), C-1003 Priya (US, plus), C-1004 Tomás (EU), C-1005 Grace (US).
# outcome: answer | escalate | refuse | clarify
# tools_allowed defaults to tools_required; any other attempted call lowers tool precision.

# --- order status ---------------------------------------------------------------------------
- id: status-01
  category: order_status
  session: C-1001
  message: Where is my order ORD-20417?
  expect: {outcome: answer, tools_required: [get_order, get_shipment], sequence: [get_order, get_shipment],
           args: {get_order: {order_id: ORD-20417}}, facts: ["Omaha", "October 3|2026-10-03|Oct 3"]}
- id: status-02
  category: order_status
  session: C-1001
  message: Has ORD-20401 been delivered?
  expect: {outcome: answer, tools_required: [get_order], tools_allowed: [get_order, get_shipment], facts: ["delivered"]}
- id: status-03
  category: order_status
  session: C-1002
  message: What's happening with ORD-20430? I ordered it days ago.
  expect: {outcome: answer, tools_required: [get_order], facts: ["processing"]}
- id: status-04
  category: order_status
  session: C-1003
  message: My tent footprint order ORD-20419 hasn't arrived. Where is it?
  expect: {outcome: answer, tools_required: [get_order, get_shipment], tools_allowed: [get_order, get_shipment, escalate_to_human, search_kb],
           facts: ["address|held|depot|Memphis"]}
- id: status-05
  category: order_status
  session: C-1004
  message: Can you tell me the status of ORD-20426?
  expect: {outcome: answer, tools_required: [get_order], facts: ["cancelled|canceled"]}
- id: status-06
  category: order_status
  session: C-1005
  message: When will ORD-20433 ship?
  expect: {outcome: answer, tools_required: [get_order], tools_allowed: [get_order, search_kb], facts: ["processing|not yet shipped|hasn't shipped|has not shipped"]}
- id: orders-01
  category: order_status
  session: C-1001
  message: What was my most recent order?
  expect: {outcome: answer, tools_required: [list_orders], args: {list_orders: {customer_id: C-1001}}, facts: ["ORD-20417"]}
- id: orders-02
  category: order_status
  session: C-1002
  message: How many orders do I have with you?
  expect: {outcome: answer, tools_required: [list_orders], facts: ["2|two"]}
- id: orders-03
  category: order_status
  session: C-1003
  message: My email is priya.nair@example.com. Which of my orders are still on the way?
  expect: {outcome: answer, tools_required: [list_orders], tools_allowed: [list_orders, lookup_customer, get_order, get_shipment], facts: ["ORD-20419"]}

